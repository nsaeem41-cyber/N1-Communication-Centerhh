<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الذكي لمحادثات الكباتن 🚀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #fff; }
    </style>
</head>
<body class="p-8 flex flex-col items-center">

    <h1 class="text-3xl font-black text-yellow-500 mb-6">أداة سحب الأرقام الذكية 🌟</h1>
    
    <div class="bg-slate-800 p-8 rounded-2xl shadow-lg w-full max-w-2xl text-center border border-slate-700">
        <p class="text-slate-300 mb-6 font-bold text-lg">ارفع ملف المحادثة بصيغة txt وسيقوم السيستم باستخراج الأرقام غير المحفوظة ومعرفة حالتها فورا</p>
        
        <label class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl cursor-pointer font-black text-lg inline-flex items-center gap-2 transition-colors shadow-lg shadow-blue-500/30">
            📂 اختر ملف الواتساب
            <input type="file" id="whatsappFile" accept=".txt" class="hidden">
        </label>
    </div>

    <div id="resultsContainer" class="mt-8 w-full max-w-2xl hidden">
        <h2 class="text-2xl font-black text-emerald-400 mb-4">الأرقام المستخرجة 💎</h2>
        <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-xl">
            <table class="w-full text-right text-sm">
                <thead class="bg-slate-900 border-b border-yellow-500/50">
                    <tr>
                        <th class="p-4 font-black text-slate-300">الرقم المستخرج</th>
                        <th class="p-4 font-black text-slate-300">حالة الكابتن</th>
                    </tr>
                </thead>
                <tbody id="resultsTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('whatsappFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                
                // البصمات الذكية اللي اتفقنا عليها
                const docRequestPattern = /المستندات المطلوبة|إرسال المستندات/i;
                const activationPattern = /تم تفعيل حسابك|تفعيل حسابك بنجاح/i;
                
                // تحليل النص سطر بسطر
                const lines = text.split('\n');
                const extractedData = new Map();

                lines.forEach(line => {
                    const phoneMatch = line.match(/07\d{8}/);
                    if (phoneMatch) {
                        const phone = phoneMatch[0];
                        let status = 'غير محدد';
                        
                        if (activationPattern.test(line)) {
                            status = 'مفعل ✅';
                        } else if (docRequestPattern.test(line)) {
                            status = 'قيد التوثيق ⏳';
                        }
                        
                        // حفظ الرقم بس اذا كان اله حالة واضحة عشان نستثني الارقام العادية
                        if (status !== 'غير محدد') {
                            extractedData.set(phone, status);
                        }
                    }
                });

                // عرض النتائج في الجدول
                const tbody = document.getElementById('resultsTableBody');
                tbody.innerHTML = '';
                
                if (extractedData.size === 0) {
                    tbody.innerHTML = '<tr><td colspan="2" class="p-8 text-center text-slate-400 font-bold">لم يتم العثور على أرقام تطابق شروط التفعيل أو التوثيق في هذا الملف</td></tr>';
                } else {
                    extractedData.forEach((status, phone) => {
                        const row = document.createElement('tr');
                        row.className = 'border-b border-slate-700/50 hover:bg-slate-700/50 transition-colors';
                        row.innerHTML = `<td class="p-4 font-mono text-yellow-400 text-lg tracking-wider" dir="ltr">${phone}</td><td class="p-4 font-bold text-lg ${status.includes('مفعل') ? 'text-emerald-400' : 'text-blue-400'}">${status}</td>`;
                        tbody.appendChild(row);
                    });
                }
                
                document.getElementById('resultsContainer').classList.remove('hidden');
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
